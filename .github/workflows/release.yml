name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui]" build
      - name: Build wheel/sdist
        run: python -m build
      - name: Upload wheel/sdist
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  pyinstaller-linux:
    runs-on: ubuntu-latest
    needs: build-wheel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui]" pyinstaller
      - name: Build CLI binary
        run: pyinstaller -F -n codexrenderer cli_entry.py --collect-data codexrenderer
      - name: Build GUI binary (windowed)
        run: |
          pyinstaller -F -w \
            -n geminirenderer-gui \
            gui_entry.py \
            --collect-data codexrenderer \
            --hidden-import=tkinterdnd2
      - name: Upload linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            dist/codexrenderer
            dist/geminirenderer-gui

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-wheel, pyinstaller-linux]
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/python-dist/*
            artifacts/linux-binaries/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
